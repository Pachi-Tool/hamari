name: build-pages

on:
  push:
    branches: [main]
    paths:
      - 'machines.json'
      - 'build.py'
      - 'slot_machines.json'
      - 'build_slot.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ページを生成
        run: python build.py

      - name: スロットのページを生成
        run: python build_slot.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m/ index.html sitemap.xml slot/
          if git diff --staged --quiet; then
            echo "変更なし。コミットはスキップします。"
          else
            git commit -m "自動生成: 機種ページとサイトマップを更新"
            git push
          fi
