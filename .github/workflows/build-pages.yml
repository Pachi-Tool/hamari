name: build-pages

on:
  push:
    branches: [main]
    paths:
      - 'machines.json'
      - 'build.py'
      - 'slot_machines.json'
      - 'build_slot.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pythonを準備
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: ページを生成
        run: python build.py

      - name: スロットのページを生成
        run: python build_slot.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m/ index.html sitemap.xml sitemap.txt slot/
          if git diff --staged --quiet; then
            echo "変更なし。コミットはスキップします。"
          else
            git commit -m "自動生成: 機種ページとサイトマップを更新"
            git push
          fi
